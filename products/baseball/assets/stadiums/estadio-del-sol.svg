<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <linearGradient id="stands-grad-es" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1a2d38"/>
            <stop offset="50%" stop-color="#144d5c"/>
            <stop offset="100%" stop-color="#0f2630"/>
        </linearGradient>
        <linearGradient id="grass-grad-es" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#32964f"/>
            <stop offset="100%" stop-color="#1f6e35"/>
        </linearGradient>
        <pattern id="lawn-stripes-es" width="36" height="36" patternUnits="userSpaceOnUse"
                 patternTransform="rotate(45)">
            <rect width="18" height="36" fill="#2d8747" fill-opacity="0.25"/>
            <rect x="18" width="18" height="36" fill="#3eb360" fill-opacity="0.25"/>
        </pattern>
        <radialGradient id="infield-dirt-grad-es" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#df9a65"/>
            <stop offset="85%" stop-color="#c9814b"/>
            <stop offset="100%" stop-color="#ab6634"/>
        </radialGradient>
        <linearGradient id="track-grad-es" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#c77b44"/>
            <stop offset="100%" stop-color="#9e5a2a"/>
        </linearGradient>
    </defs>

    <!-- Background & Concourse/Stands -->
    <g id="background-stands">
        <rect width="800" height="800" fill="#0b1b22"/>
        <!-- Tropical Concourse Footprint (Turquoise & Coral Accents) -->
        <path d="M 120 730 C 40 570 40 270 160 130 C 260 30 540 30 640 130 C 760 270 760 570 680 730 C 600 760 200 760 120 730 Z"
              fill="url(#stands-grad-es)" stroke="#17a2b8" stroke-width="4"/>
        <!-- Concourse Rings -->
        <path d="M 140 710 C 70 560 70 290 180 150 C 270 60 530 60 620 150 C 730 290 730 560 660 710" fill="none"
              stroke="#20c997" stroke-width="2" stroke-dasharray="10,6"/>
        <path d="M 160 690 C 100 550 100 310 200 180 C 280 90 520 90 600 180 C 700 310 700 550 640 690" fill="none"
              stroke="#0e566c" stroke-width="3"/>
        <!-- Tropical Palm Silhouette Accents in Outfield Plaza -->
        <circle cx="210" cy="115" r="16" fill="#ff7675" fill-opacity="0.8"/>
        <circle cx="590" cy="115" r="16" fill="#ff7675" fill-opacity="0.8"/>
        <polygon points="400,35 415,70 385,70" fill="#fdcb6e"/>
    </g>

    <!-- Foul Territory (Small preset) -->
    <g id="foul-territory">
        <path d="M 128 408 L 150 640 C 150 715 280 715 400 715 C 520 715 650 715 650 640 L 672 408 L 400 680 Z"
              fill="#1e6332"/>
        <path d="M 128 408 L 150 640 C 150 715 280 715 400 715 C 520 715 650 715 650 640 L 672 408" fill="none"
              stroke="#12421f" stroke-width="3"/>
    </g>

    <!-- Outfield Grass & Turf Pattern -->
    <g id="outfield-grass">
        <!-- LF: 335ft (128,408), LCF: 385ft (231,271), CF: 410ft (400,208), RCF: 385ft (569,271), RF: 335ft (672,408) -->
        <path d="M 400 680 L 128 408 Q 231 271 400 208 Q 569 271 672 408 Z" fill="url(#grass-grad-es)"/>
        <path d="M 400 680 L 128 408 Q 231 271 400 208 Q 569 271 672 408 Z" fill="url(#lawn-stripes-es)"/>
    </g>

    <!-- Warning Track -->
    <g id="warning-track">
        <path d="M 128 408 Q 231 271 400 208 Q 569 271 672 408 L 658 420 Q 560 289 400 230 Q 240 289 142 420 Z"
              fill="url(#track-grad-es)" stroke="#80441c" stroke-width="1"/>
        <path d="M 150 620 C 150 705 280 705 400 705 C 520 705 650 705 650 620 L 640 620 C 640 695 520 695 400 695 C 280 695 160 695 160 620 Z"
              fill="url(#track-grad-es)"/>
    </g>

    <!-- Infield Dirt Diamond & Pitcher's Mound -->
    <g id="infield-dirt">
        <path d="M 400 480 C 475 480 535 540 535 615 C 535 645 520 675 490 705 L 400 715 L 310 705 C 280 675 265 645 265 615 C 265 540 325 480 400 480 Z"
              fill="url(#infield-dirt-grad-es)" stroke="#945326" stroke-width="2"/>
        <polygon points="400,660 470,590 400,520 330,590" fill="#32964f"/>
        <polygon points="400,660 470,590 400,520 330,590" fill="url(#lawn-stripes-es)"/>
        <circle cx="400" cy="610" r="14" fill="#c9814b" stroke="#80441c" stroke-width="1.5"/>
        <rect x="396" y="609" width="8" height="2.5" fill="#ffffff"/>
        <circle cx="400" cy="678" r="26" fill="url(#infield-dirt-grad-es)"/>
        <circle cx="473" cy="607" r="11" fill="url(#infield-dirt-grad-es)"/>
        <circle cx="400" cy="534" r="11" fill="url(#infield-dirt-grad-es)"/>
        <circle cx="327" cy="607" r="11" fill="url(#infield-dirt-grad-es)"/>
    </g>

    <!-- Base Paths & Chalk Lines -->
    <g id="base-paths-lines">
        <line x1="400" y1="680" x2="128" y2="408" stroke="#ffffff" stroke-width="2.5"/>
        <line x1="400" y1="680" x2="672" y2="408" stroke="#ffffff" stroke-width="2.5"/>
        <line x1="400" y1="680" x2="473" y2="607" stroke="#ffffff" stroke-width="2"/>
        <line x1="473" y1="607" x2="400" y2="534" stroke="#ffffff" stroke-width="2"/>
        <line x1="400" y1="534" x2="327" y2="607" stroke="#ffffff" stroke-width="2"/>
        <line x1="327" y1="607" x2="400" y2="680" stroke="#ffffff" stroke-width="2"/>
        <rect x="388" y="672" width="6" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <rect x="406" y="672" width="6" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <rect x="495" y="620" width="16" height="8" fill="none" stroke="#ffffff" stroke-width="1"
              transform="rotate(-45 503 624)"/>
        <rect x="289" y="620" width="16" height="8" fill="none" stroke="#ffffff" stroke-width="1"
              transform="rotate(45 297 624)"/>
    </g>

    <!-- Bases -->
    <g id="bases">
        <polygon points="400,680 404,676 404,672 396,672 396,676" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
        <polygon points="473,601 479,607 473,613 467,607" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
        <polygon points="400,528 406,534 400,540 394,534" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
        <polygon points="327,601 333,607 327,613 321,607" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
    </g>

    <!-- Outfield Wall (8ft Height) -->
    <g id="outfield-wall">
        <path d="M 128 408 Q 231 271 400 208 Q 569 271 672 408" fill="none" stroke="#0e3c1d" stroke-width="6"
              stroke-linecap="round"/>
        <path d="M 128 408 Q 231 271 400 208 Q 569 271 672 408" fill="none" stroke="#ff7675" stroke-width="2.5"
              stroke-linecap="round"/>
    </g>

    <!-- Stadium Accents & Details -->
    <g id="stadium-accents">
        <circle cx="128" cy="408" r="5" fill="#ffd60a" stroke="#000000" stroke-width="1"/>
        <circle cx="672" cy="408" r="5" fill="#ffd60a" stroke="#000000" stroke-width="1"/>
        <text x="133" y="392" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">335</text>
        <text x="390" y="194" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">410</text>
        <text x="652" y="392" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">335</text>
        <!-- Tropical Header -->
        <rect x="330" y="745" width="140" height="18" rx="4" fill="#144d5c" stroke="#fdcb6e" stroke-width="1"/>
        <text x="400" y="758" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fdcb6e"
              text-anchor="middle">SANTO DOMINGO
        </text>
        <text x="400" y="785" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ff7675"
              text-anchor="middle" letter-spacing="2">ESTADIO DEL SOL
        </text>
    </g>
</svg>
