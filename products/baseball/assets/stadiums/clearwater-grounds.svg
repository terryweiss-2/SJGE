<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img"
     aria-label="Clearwater Grounds">
    <title>Clearwater Grounds</title>
    <rect width="800" height="800" fill="#1b2430"/>
    <g id="background-stands">
        <path d="M 400 720 L 124.4 444.4 L 234.3 320.1 L 400 272.7 L 563.3 325.9 L 657.1 462.9 Z" fill="#8a93a0"
              stroke="#5c6470" stroke-width="4"/>
    </g>
    <g id="outfield-grass">
        <path d="M 400 720 L 172.2 492.2 L 260.2 382.4 L 400 340.2 L 537.4 388.2 L 609.4 510.6 Z"
              fill="hsl(129,55%,34%)"/>
        <circle cx="400" cy="570" r="220" fill="hsl(129,55%,38%)" opacity="0.35"/>
    </g>
    <g id="warning-track">
        <path d="M 172.2 492.2 L 260.2 382.4 L 400 340.2 L 537.4 388.2 L 609.4 510.6" fill="none" stroke="#a9744a"
              stroke-width="16" stroke-linejoin="round"/>
    </g>
    <g id="foul-territory">
        <path d="M 400 720 L 172.2 492.2 M 400 720 L 609.4 510.6" stroke="#ffffff" stroke-width="3" fill="none"/>
    </g>
    <g id="infield-dirt">
        <circle cx="400" cy="663" r="100" fill="#b98558"/>
        <circle cx="400" cy="663" r="9" fill="#9d6d45"/>
    </g>
    <g id="base-paths-lines">
        <path d="M 400 720 L 457 663 L 400 606 L 343 663 Z" fill="none" stroke="#f1e6d0" stroke-width="3"/>
    </g>
    <g id="bases">
        <rect x="452" y="658" width="10" height="10" fill="#ffffff" transform="rotate(45 457 663)"/>
        <rect x="395" y="601" width="10" height="10" fill="#ffffff" transform="rotate(45 400 606)"/>
        <rect x="338" y="658" width="10" height="10" fill="#ffffff" transform="rotate(45 343 663)"/>
        <path d="M 394 716 L 406 716 L 406 723 L 400 729 L 394 723 Z" fill="#ffffff"/>
    </g>
    <g id="outfield-wall">
        <path d="M 172.2 492.2 L 260.2 382.4 L 400 340.2 L 537.4 388.2 L 609.4 510.6" fill="none" stroke="#1f5f3a"
              stroke-width="4" stroke-linejoin="round"/>
    </g>
    <g id="stadium-accents">
        <circle cx="400" cy="630" r="3" fill="#f1e6d0"/>
    </g>
</svg>
