<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <linearGradient id="stands-grad-gn" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#141c28"/>
            <stop offset="50%" stop-color="#19283d"/>
            <stop offset="100%" stop-color="#0f1622"/>
        </linearGradient>
        <linearGradient id="grass-grad-gn" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#246e40"/>
            <stop offset="100%" stop-color="#164d2b"/>
        </linearGradient>
        <pattern id="lawn-stripes-gn" width="36" height="36" patternUnits="userSpaceOnUse"
                 patternTransform="rotate(90)">
            <rect width="18" height="36" fill="#1e5c35" fill-opacity="0.3"/>
            <rect x="18" width="18" height="36" fill="#2d824d" fill-opacity="0.3"/>
        </pattern>
        <radialGradient id="infield-dirt-grad-gn" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#cc8f58"/>
            <stop offset="85%" stop-color="#b87842"/>
            <stop offset="100%" stop-color="#9a5e2d"/>
        </radialGradient>
        <linearGradient id="track-grad-gn" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ab6e38"/>
            <stop offset="100%" stop-color="#8a5223"/>
        </linearGradient>
    </defs>

    <!-- Background & Concourse/Stands -->
    <g id="background-stands">
        <rect width="800" height="800" fill="#0b1018"/>
        <!-- Montreal Northern Footprint (Royal Blue & Maple Crimson Accents) -->
        <path d="M 120 740 C 40 580 40 280 160 140 C 260 40 540 40 640 140 C 760 280 760 580 680 740 C 600 780 200 780 120 740 Z"
              fill="url(#stands-grad-gn)" stroke="#27446e" stroke-width="4"/>
        <!-- Concourse Rings -->
        <path d="M 140 720 C 70 570 70 300 180 160 C 270 70 530 70 620 160 C 730 300 730 570 660 720" fill="none"
              stroke="#3b629c" stroke-width="2" stroke-dasharray="12,6"/>
        <path d="M 160 700 C 100 560 100 320 200 190 C 280 100 520 100 600 190 C 700 320 700 560 640 700" fill="none"
              stroke="#182c4a" stroke-width="3"/>
        <!-- Maple Leaf Red Accents in Concourse Canopy -->
        <circle cx="200" cy="120" r="14" fill="#c0392b" fill-opacity="0.8"/>
        <circle cx="600" cy="120" r="14" fill="#c0392b" fill-opacity="0.8"/>
        <polygon points="400,40 415,75 385,75" fill="#3498db"/>
    </g>

    <!-- Foul Territory (Large preset) -->
    <g id="foul-territory">
        <path d="M 120 400 L 120 680 C 120 760 260 760 400 760 C 540 760 680 760 680 680 L 680 400 L 400 680 Z"
              fill="#174728"/>
        <path d="M 120 400 L 120 680 C 120 760 260 760 400 760 C 540 760 680 760 680 680 L 680 400" fill="none"
              stroke="#0f331b" stroke-width="3"/>
    </g>

    <!-- Outfield Grass & Turf Pattern -->
    <g id="outfield-grass">
        <!-- LF: 345ft (120,400), LCF: 385ft (231,271), CF: 410ft (400,208), RCF: 385ft (569,271), RF: 345ft (680,400) -->
        <path d="M 400 680 L 120 400 Q 231 271 400 208 Q 569 271 680 400 Z" fill="url(#grass-grad-gn)"/>
        <path d="M 400 680 L 120 400 Q 231 271 400 208 Q 569 271 680 400 Z" fill="url(#lawn-stripes-gn)"/>
    </g>

    <!-- Warning Track -->
    <g id="warning-track">
        <path d="M 120 400 Q 231 271 400 208 Q 569 271 680 400 L 666 414 Q 560 290 400 230 Q 240 290 134 414 Z"
              fill="url(#track-grad-gn)" stroke="#74441a" stroke-width="1"/>
        <path d="M 120 650 C 120 750 260 750 400 750 C 540 750 680 750 680 650 L 670 650 C 670 740 540 740 400 740 C 260 740 130 740 130 650 Z"
              fill="url(#track-grad-gn)"/>
    </g>

    <!-- Infield Dirt Diamond & Pitcher's Mound -->
    <g id="infield-dirt">
        <path d="M 400 480 C 475 480 535 540 535 615 C 535 645 520 675 490 705 L 400 715 L 310 705 C 280 675 265 645 265 615 C 265 540 325 480 400 480 Z"
              fill="url(#infield-dirt-grad-gn)" stroke="#804a1f" stroke-width="2"/>
        <polygon points="400,660 470,590 400,520 330,590" fill="#246e40"/>
        <polygon points="400,660 470,590 400,520 330,590" fill="url(#lawn-stripes-gn)"/>
        <circle cx="400" cy="610" r="14" fill="#b87842" stroke="#754116" stroke-width="1.5"/>
        <rect x="396" y="609" width="8" height="2.5" fill="#ffffff"/>
        <circle cx="400" cy="678" r="26" fill="url(#infield-dirt-grad-gn)"/>
        <circle cx="473" cy="607" r="11" fill="url(#infield-dirt-grad-gn)"/>
        <circle cx="400" cy="534" r="11" fill="url(#infield-dirt-grad-gn)"/>
        <circle cx="327" cy="607" r="11" fill="url(#infield-dirt-grad-gn)"/>
    </g>

    <!-- Base Paths & Chalk Lines -->
    <g id="base-paths-lines">
        <line x1="400" y1="680" x2="120" y2="400" stroke="#ffffff" stroke-width="2.5"/>
        <line x1="400" y1="680" x2="680" y2="400" stroke="#ffffff" stroke-width="2.5"/>
        <line x1="400" y1="680" x2="473" y2="607" stroke="#ffffff" stroke-width="2"/>
        <line x1="473" y1="607" x2="400" y2="534" stroke="#ffffff" stroke-width="2"/>
        <line x1="400" y1="534" x2="327" y2="607" stroke="#ffffff" stroke-width="2"/>
        <line x1="327" y1="607" x2="400" y2="680" stroke="#ffffff" stroke-width="2"/>
        <rect x="388" y="672" width="6" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <rect x="406" y="672" width="6" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <rect x="495" y="620" width="16" height="8" fill="none" stroke="#ffffff" stroke-width="1"
              transform="rotate(-45 503 624)"/>
        <rect x="289" y="620" width="16" height="8" fill="none" stroke="#ffffff" stroke-width="1"
              transform="rotate(45 297 624)"/>
    </g>

    <!-- Bases -->
    <g id="bases">
        <polygon points="400,680 404,676 404,672 396,672 396,676" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
        <polygon points="473,601 479,607 473,613 467,607" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
        <polygon points="400,528 406,534 400,540 394,534" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
        <polygon points="327,601 333,607 327,613 321,607" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
    </g>

    <!-- Outfield Wall (12ft Wall Height) -->
    <g id="outfield-wall">
        <path d="M 120 400 Q 231 271 400 208 Q 569 271 680 400" fill="none" stroke="#122c1b" stroke-width="8"
              stroke-linecap="round"/>
        <path d="M 120 400 Q 231 271 400 208 Q 569 271 680 400" fill="none" stroke="#2980b9" stroke-width="2.5"
              stroke-linecap="round"/>
    </g>

    <!-- Stadium Accents & Details -->
    <g id="stadium-accents">
        <circle cx="120" cy="400" r="5" fill="#ffd60a" stroke="#000000" stroke-width="1"/>
        <circle cx="680" cy="400" r="5" fill="#ffd60a" stroke="#000000" stroke-width="1"/>
        <text x="125" y="384" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">345</text>
        <text x="390" y="194" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">410</text>
        <text x="660" y="384" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">345</text>
        <!-- Montreal Header -->
        <rect x="330" y="745" width="140" height="18" rx="4" fill="#19283d" stroke="#c0392b" stroke-width="1"/>
        <text x="400" y="758" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff"
              text-anchor="middle">MONTREAL, CA
        </text>
        <text x="400" y="785" font-family="sans-serif" font-size="14" font-weight="bold" fill="#5dade2"
              text-anchor="middle" letter-spacing="2">GREAT NORTHERN FIELD
        </text>
    </g>
</svg>
