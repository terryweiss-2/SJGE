<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <linearGradient id="stands-grad-pm" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c1e18"/>
            <stop offset="50%" stop-color="#4a2a1c"/>
            <stop offset="100%" stop-color="#211510"/>
        </linearGradient>
        <linearGradient id="grass-grad-pm" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3b8244"/>
            <stop offset="100%" stop-color="#255e2d"/>
        </linearGradient>
        <pattern id="lawn-stripes-pm" width="36" height="36" patternUnits="userSpaceOnUse"
                 patternTransform="rotate(45)">
            <rect width="18" height="36" fill="#2d6e35" fill-opacity="0.25"/>
            <rect x="18" width="18" height="36" fill="#469951" fill-opacity="0.25"/>
        </pattern>
        <radialGradient id="infield-dirt-grad-pm" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#d6844d"/>
            <stop offset="85%" stop-color="#be6d38"/>
            <stop offset="100%" stop-color="#9e5223"/>
        </radialGradient>
        <linearGradient id="track-grad-pm" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#b85f30"/>
            <stop offset="100%" stop-color="#8a3f18"/>
        </linearGradient>
    </defs>

    <!-- Background & Concourse/Stands -->
    <g id="background-stands">
        <rect width="800" height="800" fill="#140d0a"/>
        <!-- Monterrey Terracotta Bowl -->
        <path d="M 120 730 C 40 570 40 270 160 130 C 260 30 540 30 640 130 C 760 270 760 570 680 730 C 600 760 200 760 120 730 Z"
              fill="url(#stands-grad-pm)" stroke="#a04020" stroke-width="4"/>
        <!-- Concourse Rings -->
        <path d="M 140 710 C 70 560 70 290 180 150 C 270 60 530 60 620 150 C 730 290 730 560 660 710" fill="none"
              stroke="#d35400" stroke-width="2" stroke-dasharray="10,6"/>
        <path d="M 160 690 C 100 550 100 310 200 180 C 280 90 520 90 600 180 C 700 310 700 550 640 690" fill="none"
              stroke="#6e2b14" stroke-width="3"/>
        <!-- Sierra Madre Mountain Outline in Backdrop -->
        <polygon points="340,65 370,30 400,65" fill="#e67e22" fill-opacity="0.6"/>
        <polygon points="380,65 415,22 450,65" fill="#d35400" fill-opacity="0.8"/>
        <polygon points="430,65 460,35 490,65" fill="#e67e22" fill-opacity="0.6"/>
    </g>

    <!-- Foul Territory (Medium preset) -->
    <g id="foul-territory">
        <path d="M 136 416 L 136 650 C 136 730 260 730 400 730 C 540 730 664 730 664 650 L 664 416 L 400 680 Z"
              fill="#20552b"/>
        <path d="M 136 416 L 136 650 C 136 730 260 730 400 730 C 540 730 664 730 664 650 L 664 416" fill="none"
              stroke="#123b1a" stroke-width="3"/>
    </g>

    <!-- Outfield Grass & Turf Pattern -->
    <g id="outfield-grass">
        <!-- LF: 325ft (136,416), LCF: 360ft (242,297), CF: 395ft (400,226), RCF: 360ft (558,297), RF: 325ft (664,416) -->
        <path d="M 400 680 L 136 416 Q 242 297 400 226 Q 558 297 664 416 Z" fill="url(#grass-grad-pm)"/>
        <path d="M 400 680 L 136 416 Q 242 297 400 226 Q 558 297 664 416 Z" fill="url(#lawn-stripes-pm)"/>
    </g>

    <!-- Warning Track (Terracotta Red Clay) -->
    <g id="warning-track">
        <path d="M 136 416 Q 242 297 400 226 Q 558 297 664 416 L 649 428 Q 548 312 400 248 Q 252 312 151 428 Z"
              fill="url(#track-grad-pm)" stroke="#6b2b0e" stroke-width="1"/>
        <path d="M 136 625 C 136 720 260 720 400 720 C 540 720 664 720 664 625 L 654 625 C 654 710 540 710 400 710 C 260 710 146 710 146 625 Z"
              fill="url(#track-grad-pm)"/>
    </g>

    <!-- Infield Dirt Diamond & Pitcher's Mound -->
    <g id="infield-dirt">
        <path d="M 400 480 C 475 480 535 540 535 615 C 535 645 520 675 490 705 L 400 715 L 310 705 C 280 675 265 645 265 615 C 265 540 325 480 400 480 Z"
              fill="url(#infield-dirt-grad-pm)" stroke="#803e14" stroke-width="2"/>
        <polygon points="400,660 470,590 400,520 330,590" fill="#3b8244"/>
        <polygon points="400,660 470,590 400,520 330,590" fill="url(#lawn-stripes-pm)"/>
        <circle cx="400" cy="610" r="14" fill="#be6d38" stroke="#753510" stroke-width="1.5"/>
        <rect x="396" y="609" width="8" height="2.5" fill="#ffffff"/>
        <circle cx="400" cy="678" r="26" fill="url(#infield-dirt-grad-pm)"/>
        <circle cx="473" cy="607" r="11" fill="url(#infield-dirt-grad-pm)"/>
        <circle cx="400" cy="534" r="11" fill="url(#infield-dirt-grad-pm)"/>
        <circle cx="327" cy="607" r="11" fill="url(#infield-dirt-grad-pm)"/>
    </g>

    <!-- Base Paths & Chalk Lines -->
    <g id="base-paths-lines">
        <line x1="400" y1="680" x2="136" y2="416" stroke="#ffffff" stroke-width="2.5"/>
        <line x1="400" y1="680" x2="664" y2="416" stroke="#ffffff" stroke-width="2.5"/>
        <line x1="400" y1="680" x2="473" y2="607" stroke="#ffffff" stroke-width="2"/>
        <line x1="473" y1="607" x2="400" y2="534" stroke="#ffffff" stroke-width="2"/>
        <line x1="400" y1="534" x2="327" y2="607" stroke="#ffffff" stroke-width="2"/>
        <line x1="327" y1="607" x2="400" y2="680" stroke="#ffffff" stroke-width="2"/>
        <rect x="388" y="672" width="6" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <rect x="406" y="672" width="6" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <rect x="495" y="620" width="16" height="8" fill="none" stroke="#ffffff" stroke-width="1"
              transform="rotate(-45 503 624)"/>
        <rect x="289" y="620" width="16" height="8" fill="none" stroke="#ffffff" stroke-width="1"
              transform="rotate(45 297 624)"/>
    </g>

    <!-- Bases -->
    <g id="bases">
        <polygon points="400,680 404,676 404,672 396,672 396,676" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
        <polygon points="473,601 479,607 473,613 467,607" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
        <polygon points="400,528 406,534 400,540 394,534" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
        <polygon points="327,601 333,607 327,613 321,607" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
    </g>

    <!-- Outfield Wall (8ft Height) -->
    <g id="outfield-wall">
        <path d="M 136 416 Q 242 297 400 226 Q 558 297 664 416" fill="none" stroke="#1c4524" stroke-width="6"
              stroke-linecap="round"/>
        <path d="M 136 416 Q 242 297 400 226 Q 558 297 664 416" fill="none" stroke="#e67e22" stroke-width="2.5"
              stroke-linecap="round"/>
    </g>

    <!-- Stadium Accents & Details -->
    <g id="stadium-accents">
        <circle cx="136" cy="416" r="5" fill="#ffd60a" stroke="#000000" stroke-width="1"/>
        <circle cx="664" cy="416" r="5" fill="#ffd60a" stroke="#000000" stroke-width="1"/>
        <text x="140" y="402" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">325</text>
        <text x="390" y="212" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">395</text>
        <text x="644" y="402" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">325</text>
        <!-- Monterrey Header -->
        <rect x="330" y="745" width="140" height="18" rx="4" fill="#4a2a1c" stroke="#e67e22" stroke-width="1"/>
        <text x="400" y="758" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f39c12"
              text-anchor="middle">MONTERREY, MX
        </text>
        <text x="400" y="785" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e67e22"
              text-anchor="middle" letter-spacing="2">PARQUE METROPOLITANO
        </text>
    </g>
</svg>
