<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <linearGradient id="stands-grad-md" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#141c2b"/>
            <stop offset="50%" stop-color="#1b2a42"/>
            <stop offset="100%" stop-color="#0f1624"/>
        </linearGradient>
        <linearGradient id="grass-grad-md" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2a824e"/>
            <stop offset="100%" stop-color="#1c5e37"/>
        </linearGradient>
        <pattern id="turf-stripes-md" width="40" height="40" patternUnits="userSpaceOnUse">
            <circle cx="20" cy="20" r="18" fill="none" stroke="#329e5e" stroke-width="3" stroke-opacity="0.25"/>
        </pattern>
        <radialGradient id="infield-dirt-grad-md" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#cf905b"/>
            <stop offset="85%" stop-color="#b87541"/>
            <stop offset="100%" stop-color="#9a5a2a"/>
        </radialGradient>
        <linearGradient id="track-grad-md" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#b87440"/>
            <stop offset="100%" stop-color="#8f5022"/>
        </linearGradient>
    </defs>

    <!-- Background & Concourse/Stands -->
    <g id="background-stands">
        <rect width="800" height="800" fill="#0a0e17"/>
        <!-- Tokyo Modern Oval Dome Shell -->
        <path d="M 120 730 C 30 560 30 260 150 120 C 250 20 550 20 650 120 C 770 260 770 560 680 730 C 590 770 210 770 120 730 Z"
              fill="url(#stands-grad-md)" stroke="#2b4c7e" stroke-width="4"/>
        <!-- Dome Tension Cable Truss Geometry -->
        <ellipse cx="400" cy="420" rx="340" ry="320" fill="none" stroke="#3b68a8" stroke-width="2"
                 stroke-dasharray="16,8"/>
        <ellipse cx="400" cy="420" rx="300" ry="280" fill="none" stroke="#1d3456" stroke-width="3"/>
        <!-- Tokyo Geometric Rib Lines -->
        <line x1="400" y1="100" x2="400" y2="740" stroke="#4a80cc" stroke-width="1.2" stroke-opacity="0.4"/>
        <line x1="120" y1="420" x2="680" y2="420" stroke="#4a80cc" stroke-width="1.2" stroke-opacity="0.4"/>
        <line x1="200" y1="200" x2="600" y2="640" stroke="#4a80cc" stroke-width="1.2" stroke-opacity="0.4"/>
        <line x1="600" y1="200" x2="200" y2="640" stroke="#4a80cc" stroke-width="1.2" stroke-opacity="0.4"/>
    </g>

    <!-- Foul Territory (Medium preset) -->
    <g id="foul-territory">
        <path d="M 133 413 L 133 650 C 133 730 260 730 400 730 C 540 730 667 730 667 650 L 667 413 L 400 680 Z"
              fill="#1b5a35"/>
        <path d="M 133 413 L 133 650 C 133 730 260 730 400 730 C 540 730 667 730 667 650 L 667 413" fill="none"
              stroke="#123d24" stroke-width="3"/>
    </g>

    <!-- Outfield Grass & Turf Pattern -->
    <g id="outfield-grass">
        <!-- LF: 328ft (133,413), LCF: 362ft (241,295), CF: 395ft (400,226), RCF: 362ft (559,295), RF: 328ft (667,413) -->
        <path d="M 400 680 L 133 413 Q 241 295 400 226 Q 559 295 667 413 Z" fill="url(#grass-grad-md)"/>
        <path d="M 400 680 L 133 413 Q 241 295 400 226 Q 559 295 667 413 Z" fill="url(#turf-stripes-md)"/>
    </g>

    <!-- Warning Track -->
    <g id="warning-track">
        <path d="M 133 413 Q 241 295 400 226 Q 559 295 667 413 L 652 425 Q 550 311 400 248 Q 250 311 148 425 Z"
              fill="url(#track-grad-md)" stroke="#743e18" stroke-width="1"/>
        <path d="M 133 625 C 133 720 260 720 400 720 C 540 720 667 720 667 625 L 657 625 C 657 710 540 710 400 710 C 260 710 143 710 143 625 Z"
              fill="url(#track-grad-md)"/>
    </g>

    <!-- Infield Dirt Diamond & Pitcher's Mound -->
    <g id="infield-dirt">
        <path d="M 400 480 C 475 480 535 540 535 615 C 535 645 520 675 490 705 L 400 715 L 310 705 C 280 675 265 645 265 615 C 265 540 325 480 400 480 Z"
              fill="url(#infield-dirt-grad-md)" stroke="#78441c" stroke-width="2"/>
        <polygon points="400,660 470,590 400,520 330,590" fill="#2a824e"/>
        <polygon points="400,660 470,590 400,520 330,590" fill="url(#turf-stripes-md)"/>
        <circle cx="400" cy="610" r="14" fill="#b87541" stroke="#693712" stroke-width="1.5"/>
        <rect x="396" y="609" width="8" height="2.5" fill="#ffffff"/>
        <circle cx="400" cy="678" r="26" fill="url(#infield-dirt-grad-md)"/>
        <circle cx="473" cy="607" r="11" fill="url(#infield-dirt-grad-md)"/>
        <circle cx="400" cy="534" r="11" fill="url(#infield-dirt-grad-md)"/>
        <circle cx="327" cy="607" r="11" fill="url(#infield-dirt-grad-md)"/>
    </g>

    <!-- Base Paths & Chalk Lines -->
    <g id="base-paths-lines">
        <line x1="400" y1="680" x2="133" y2="413" stroke="#ffffff" stroke-width="2.5"/>
        <line x1="400" y1="680" x2="667" y2="413" stroke="#ffffff" stroke-width="2.5"/>
        <line x1="400" y1="680" x2="473" y2="607" stroke="#ffffff" stroke-width="2"/>
        <line x1="473" y1="607" x2="400" y2="534" stroke="#ffffff" stroke-width="2"/>
        <line x1="400" y1="534" x2="327" y2="607" stroke="#ffffff" stroke-width="2"/>
        <line x1="327" y1="607" x2="400" y2="680" stroke="#ffffff" stroke-width="2"/>
        <rect x="388" y="672" width="6" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <rect x="406" y="672" width="6" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <rect x="495" y="620" width="16" height="8" fill="none" stroke="#ffffff" stroke-width="1"
              transform="rotate(-45 503 624)"/>
        <rect x="289" y="620" width="16" height="8" fill="none" stroke="#ffffff" stroke-width="1"
              transform="rotate(45 297 624)"/>
    </g>

    <!-- Bases -->
    <g id="bases">
        <polygon points="400,680 404,676 404,672 396,672 396,676" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
        <polygon points="473,601 479,607 473,613 467,607" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
        <polygon points="400,528 406,534 400,540 394,534" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
        <polygon points="327,601 333,607 327,613 321,607" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
    </g>

    <!-- Outfield Wall (13ft Height) -->
    <g id="outfield-wall">
        <path d="M 133 413 Q 241 295 400 226 Q 559 295 667 413" fill="none" stroke="#163452" stroke-width="8"
              stroke-linecap="round"/>
        <path d="M 133 413 Q 241 295 400 226 Q 559 295 667 413" fill="none" stroke="#007aff" stroke-width="2.5"
              stroke-linecap="round"/>
    </g>

    <!-- Stadium Accents & Details -->
    <g id="stadium-accents">
        <circle cx="133" cy="413" r="5" fill="#ffd60a" stroke="#000000" stroke-width="1"/>
        <circle cx="667" cy="413" r="5" fill="#ffd60a" stroke="#000000" stroke-width="1"/>
        <text x="138" y="398" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">328</text>
        <text x="390" y="212" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">395</text>
        <text x="648" y="398" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">328</text>
        <!-- Tokyo Dome Header -->
        <rect x="340" y="745" width="120" height="18" rx="4" fill="#1b2a42" stroke="#007aff" stroke-width="1"/>
        <text x="400" y="758" font-family="sans-serif" font-size="10" font-weight="bold" fill="#5ac8fa"
              text-anchor="middle">AIR DOME TOKYO
        </text>
        <text x="400" y="785" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff"
              text-anchor="middle" letter-spacing="2">METRO DOME TOKYO
        </text>
    </g>
</svg>
