<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <linearGradient id="stands-grad-bc" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1f182c"/>
            <stop offset="50%" stop-color="#2c1e42"/>
            <stop offset="100%" stop-color="#161021"/>
        </linearGradient>
        <linearGradient id="grass-grad-bc" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#24784a"/>
            <stop offset="100%" stop-color="#185633"/>
        </linearGradient>
        <pattern id="turf-stripes-bc" width="30" height="30" patternUnits="userSpaceOnUse">
            <rect width="15" height="30" fill="#1b5a37" fill-opacity="0.3"/>
            <rect x="15" width="15" height="30" fill="#288551" fill-opacity="0.3"/>
        </pattern>
        <radialGradient id="infield-dirt-grad-bc" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#cf9461"/>
            <stop offset="85%" stop-color="#ba7c49"/>
            <stop offset="100%" stop-color="#9a6234"/>
        </radialGradient>
        <linearGradient id="track-grad-bc" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ba7d4c"/>
            <stop offset="100%" stop-color="#945f34"/>
        </linearGradient>
    </defs>

    <!-- Background & Concourse/Stands -->
    <g id="background-stands">
        <rect width="800" height="800" fill="#0d0a14"/>
        <!-- Dome Circular Outer Structure -->
        <circle cx="400" cy="450" r="360" fill="url(#stands-grad-bc)" stroke="#4a336e" stroke-width="5"/>
        <circle cx="400" cy="450" r="330" fill="none" stroke="#684a96" stroke-width="2" stroke-dasharray="14,8"/>
        <circle cx="400" cy="450" r="290" fill="none" stroke="#33204e" stroke-width="3"/>
        <!-- Dome Roof Truss Radial Ribs -->
        <line x1="400" y1="90" x2="400" y2="810" stroke="#7e5ca8" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="40" y1="450" x2="760" y2="450" stroke="#7e5ca8" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="145" y1="195" x2="655" y2="705" stroke="#7e5ca8" stroke-width="1.5" stroke-opacity="0.4"/>
        <line x1="655" y1="195" x2="145" y2="705" stroke="#7e5ca8" stroke-width="1.5" stroke-opacity="0.4"/>
    </g>

    <!-- Foul Territory (Medium preset) -->
    <g id="foul-territory">
        <path d="M 132 412 L 132 650 C 132 730 260 730 400 730 C 540 730 668 730 668 650 L 668 412 L 400 680 Z"
              fill="#1b5634"/>
        <path d="M 132 412 L 132 650 C 132 730 260 730 400 730 C 540 730 668 730 668 650 L 668 412" fill="none"
              stroke="#103d23" stroke-width="3"/>
    </g>

    <!-- Outfield Grass & Turf Pattern -->
    <g id="outfield-grass">
        <!-- LF: 330ft (132,412), LCF: 375ft (235,283), CF: 400ft (400,220), RCF: 375ft (565,283), RF: 330ft (668,412) -->
        <path d="M 400 680 L 132 412 Q 235 283 400 220 Q 565 283 668 412 Z" fill="url(#grass-grad-bc)"/>
        <path d="M 400 680 L 132 412 Q 235 283 400 220 Q 565 283 668 412 Z" fill="url(#turf-stripes-bc)"/>
    </g>

    <!-- Warning Track -->
    <g id="warning-track">
        <path d="M 132 412 Q 235 283 400 220 Q 565 283 668 412 L 653 424 Q 555 301 400 242 Q 245 301 147 424 Z"
              fill="url(#track-grad-bc)" stroke="#784724" stroke-width="1"/>
        <path d="M 132 625 C 132 720 260 720 400 720 C 540 720 668 720 668 625 L 658 625 C 658 710 540 710 400 710 C 260 710 142 710 142 625 Z"
              fill="url(#track-grad-bc)"/>
    </g>

    <!-- Infield Dirt Diamond & Pitcher's Mound -->
    <g id="infield-dirt">
        <path d="M 400 480 C 475 480 535 540 535 615 C 535 645 520 675 490 705 L 400 715 L 310 705 C 280 675 265 645 265 615 C 265 540 325 480 400 480 Z"
              fill="url(#infield-dirt-grad-bc)" stroke="#7d4b22" stroke-width="2"/>
        <polygon points="400,660 470,590 400,520 330,590" fill="#24784a"/>
        <polygon points="400,660 470,590 400,520 330,590" fill="url(#turf-stripes-bc)"/>
        <circle cx="400" cy="610" r="14" fill="#ba7c49" stroke="#6b3e18" stroke-width="1.5"/>
        <rect x="396" y="609" width="8" height="2.5" fill="#ffffff"/>
        <circle cx="400" cy="678" r="26" fill="url(#infield-dirt-grad-bc)"/>
        <circle cx="473" cy="607" r="11" fill="url(#infield-dirt-grad-bc)"/>
        <circle cx="400" cy="534" r="11" fill="url(#infield-dirt-grad-bc)"/>
        <circle cx="327" cy="607" r="11" fill="url(#infield-dirt-grad-bc)"/>
    </g>

    <!-- Base Paths & Chalk Lines -->
    <g id="base-paths-lines">
        <line x1="400" y1="680" x2="132" y2="412" stroke="#ffffff" stroke-width="2.5"/>
        <line x1="400" y1="680" x2="668" y2="412" stroke="#ffffff" stroke-width="2.5"/>
        <line x1="400" y1="680" x2="473" y2="607" stroke="#ffffff" stroke-width="2"/>
        <line x1="473" y1="607" x2="400" y2="534" stroke="#ffffff" stroke-width="2"/>
        <line x1="400" y1="534" x2="327" y2="607" stroke="#ffffff" stroke-width="2"/>
        <line x1="327" y1="607" x2="400" y2="680" stroke="#ffffff" stroke-width="2"/>
        <rect x="388" y="672" width="6" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <rect x="406" y="672" width="6" height="12" fill="none" stroke="#ffffff" stroke-width="1.2"/>
        <rect x="495" y="620" width="16" height="8" fill="none" stroke="#ffffff" stroke-width="1"
              transform="rotate(-45 503 624)"/>
        <rect x="289" y="620" width="16" height="8" fill="none" stroke="#ffffff" stroke-width="1"
              transform="rotate(45 297 624)"/>
    </g>

    <!-- Bases -->
    <g id="bases">
        <polygon points="400,680 404,676 404,672 396,672 396,676" fill="#ffffff" stroke="#333333" stroke-width="0.8"/>
        <polygon points="473,601 479,607 473,613 467,607" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
        <polygon points="400,528 406,534 400,540 394,534" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
        <polygon points="327,601 333,607 327,613 321,607" fill="#ffffff" stroke="#555555" stroke-width="0.8"/>
    </g>

    <!-- Outfield Wall (10ft Uniform Height) -->
    <g id="outfield-wall">
        <path d="M 132 412 Q 235 283 400 220 Q 565 283 668 412" fill="none" stroke="#163821" stroke-width="7"
              stroke-linecap="round"/>
        <path d="M 132 412 Q 235 283 400 220 Q 565 283 668 412" fill="none" stroke="#d4af37" stroke-width="2.5"
              stroke-linecap="round"/>
    </g>

    <!-- Stadium Accents & Details -->
    <g id="stadium-accents">
        <circle cx="132" cy="412" r="5" fill="#ffd60a" stroke="#000000" stroke-width="1"/>
        <circle cx="668" cy="412" r="5" fill="#ffd60a" stroke="#000000" stroke-width="1"/>
        <text x="136" y="398" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">330</text>
        <text x="390" y="206" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">400</text>
        <text x="648" y="398" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">330</text>
        <!-- Dome Indicator Badge -->
        <rect x="350" y="745" width="100" height="18" rx="4" fill="#382159" stroke="#d4af37" stroke-width="1"/>
        <text x="400" y="758" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffd700"
              text-anchor="middle">CLIMATE DOME
        </text>
        <text x="400" y="785" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d4af37"
              text-anchor="middle" letter-spacing="2">BAYOU COLISEUM
        </text>
    </g>
</svg>
